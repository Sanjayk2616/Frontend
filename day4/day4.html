<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    forms
    it is used to collect the data from the user and allowing user to submit the data to the server
    ex:-login page,signup page,contact form,registration
    forms are defined with form

    form fields are defined with input tag
    label tag is used to provide the hint about the text field

    attributes
    type is used to control the behaviour of the text field
    value - we can provide pre-defined value
    name - it will carry the data to the backend as a key value pairs
    for && id
    it is used to connect the input to the label
    required is specified that a field must contain value before submitted
    min
    max
    maxlength

    action
    it specifies where the data should be submitted
    formsubmit.co


    -->

    <form action="" method="post">
     <label for="un">enter name</label>
     <input placeholder="enter name" id="un" type="text" value="" name="username" required maxlength="6">
     <button type="submit">submit</button>
     <button type="reset">reset</button><br><br>

     <label for="ue">enter mail</label>
     <input id="ue" type="email" name="useremail" required><br>
     <button type="submit">submit</button>
     <button type="reset">reset</button><br><br>

     <label for="">enter quantity</label>
     <input type="number" max="4" min="2"><br>
     <button type="submit">submit</button>
     <button type="reset">reset</button><br><br>

     <label for="">enter password</label>
     <input type="password"><br>
     <button type="submit">submit</button>
     <button type="reset">reset</button><br><br>

     <label for="">date of birth</label>
     <input type="date"><br><br>

     <label for="">book appoinment</label>
     <input type="datetime-local"><br><br>

     <label for="">monthly reports</label>
     <input type="month"><br><br>

     <label for="">weekly reports</label>
     <input type="week"><br><br>

     <label for="">upload file</label>
     <input type="file"><br><br>

     <label for="">search product</label>
     <input type="search"><br><br>
     
     <label for="">select range</label>
     <input type="range"><br>
     <button type="submit">submit</button>
     <button type="reset">reset</button><br><br>

     <label for="">upload deployment link</label>
     <input type="url"><br>
     <button type="submit">submit</button>
     <button type="reset">reset</button><br><br>

    </form>

    <form action="">
        <label for="">select your stack</label><br>
        <input id="py" type="radio" name="stack" value="pfs">
        <label for="py">python full stack</label>
        
        <input id="java" type="radio" name="stack" value="jfs">
        <label for="java">java full stack</label>

        <input id="mern" type="radio" name="stack" value="mern">
        <label for="mern">MERN full stack</label><br><br>


        <label for="">select your skills</label><br>
        <input type="checkbox" name="skill" value="html">
        <label for="html">html</label>

        <input type="checkbox" name="skill" value="css">
        <label for="">css</label>

        <input type="checkbox" name="skill" value="js">
        <label for="">js</label><br><br>

        <label for="">select your branch</label>
        <select name="branch" id="">
             <option value="vizag">vizag</option>
             <option value="hyderabad">hyderabad</option>
        </select><br><br>
        
        <label for="">enter briefly about your self</label><br>
        <textarea name="" rows="10" cols="10" id=""></textarea><br>

        <button type="submit">submit</button>
        <button type="reset">reset</button>
    </form>

</body>
</html>
