    <!-- 
      tags are divided based on the behaviour
      1)block level elements
       block level elements are the elements which occupies total space and always starts on a new line
       ex:-heading,p,table,ul,li,div
      2)in line elements
      inline elements are the elements which occupies neccesary space and always doesnot start on new line until space fills up
      ex:-img,a,span
      
      div - division container
      it is used to group the elements for applying
      
      span
      it is used to group the text for applying styles

      semantic tags 
      are the tags which conveys the meaning to the browser and devloper
      header,nav,footer,main,article,aside,section,figure

      iframes
      it is used to embed the another page into current page
    -->
     
     <div id = "divspan" style = "background-color: coral;">
        <h1>section <span style = "color: blue;font-size : 3rem">1</span></h1>
        <p>frontend devlopment</p>
     </div>
